<div *ngIf="track" class="audio-player-custom p-4 rounded-lg shadow-lg flex items-center space-x-4">
  <button
    (click)="togglePlay()"
    class="play-button-custom flex items-center justify-center"
    [disabled]="!isMetadataLoaded || audioError">
    <i *ngIf="!isPlaying" class='bx bx-play-circle'></i>
    <i *ngIf="isPlaying" class='bx bx-pause-circle'></i>
  </button>
  
  <div class="flex-grow">
    <p class="font-semibold text-sm truncate">{{ track.title }}</p>
    
    <div
      (click)="seekAudio($event)"
      class="w-full h-2 bg-gray-400 rounded-full mt-1 cursor-pointer"
      [class.cursor-not-allowed]="!isMetadataLoaded">
      <div class="h-full bg-[#f92582] rounded-full" [style.width.%]="progress || 0"></div>
    </div>
    
    <p class="text-xs mt-1">{{ currentTimeFormatted }} / {{ durationFormatted }}</p>
  </div>
</div>

<div *ngIf="audioError" class="mt-2 text-sm text-red-600">
  {{ audioError }}
</div>

<audio #audioPlayer [src]="track.src" preload="metadata" hidden></audio>
